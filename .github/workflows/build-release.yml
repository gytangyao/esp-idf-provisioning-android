name: Build Release APK

# 触发条件:推送 v* 标签(自动创建 GitHub Release),或在 Actions 页面手动运行
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 创建 GitHub Release 需要

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 检查签名 Secrets 是否已配置
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 Secret KEYSTORE_BASE64。请按 README 中的说明配置 KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD 四个 Secrets。"
            exit 1
          fi

      - name: 解码签名 keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: 编译并签名 Release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: 校验 APK 签名
        run: |
          ls -la app/build/outputs/apk/release/
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          echo "使用 $APKSIGNER"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: 重命名 APK
        id: apk
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            NAME="esp-provisioning-${GITHUB_REF_NAME}"
          else
            NAME="esp-provisioning-${GITHUB_REF_NAME}-${GITHUB_SHA::7}"
          fi
          cp app/build/outputs/apk/release/app-release.apk "${NAME}.apk"
          echo "path=${NAME}.apk" >> "$GITHUB_OUTPUT"

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ steps.apk.outputs.path }}

      - name: 创建 GitHub Release 并附带 APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
